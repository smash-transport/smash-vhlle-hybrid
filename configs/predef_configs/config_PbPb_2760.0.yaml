IC:
    Executable: /path/to/smash
    Software_keys:
        Modi:
            Collider:
                Projectile:
                    Particles: {2212: 82, 2112: 126} #Lead208
                Target:
                    Particles: {2212: 82, 2112: 126} #Lead208
                Sqrtsnn: 2760.0
                Initial_Conditions:
                    Type: "Constant_Tau"
                    Proper_Time_Scaling: 1

Hydro:
    Executable: /path/to/vHLLE
    Config_file: /path/to/handler/configs/predef_configs/vhlle_hydro_EPJA_58-11-230
    Software_keys:
        etaS: 0.08
        Rg: 1.2
        Rgz: 1.3
        # These settings were used for the hydrodynamical simulations in Eur.Phys.J.A 58 (2022) 11, 230
        # nx: 201
        # ny: 201
        # nz: 401

Sampler:
    Executable: /path/to/hadron-sampler
    Software_keys:
        bulk: 0
        ecrit: 0.5

Afterburner:
    Executable: /path/to/smash
    Software_keys:
        Collision_Term:
            Strings: True
            String_Parameters:
                Use_Monash_Tune: True
            Cross_Section_Scaling: 1
