Logging:
    default: INFO

General:
    Modus:          Collider
    Time_Step_Mode: Fixed
    Delta_Time:     0.05
    End_Time:       20.0
    Randomseed:     -1
    Nevents:        1
    Gaussian_Sigma: 0.7

Output:
    Initial_Conditions:
        Format: ["Oscar2013"]
        Extended: True
    Particles:
        Format: ["Oscar2013"]
        Extended: True
        Only_Final: "Yes"

Modi:
    Collider:
        Projectile:
            Particles: {2212: 79, 2112: 118} #Gold197
        Target:
            Particles: {2212: 79, 2112: 118} #Gold197
        Sqrtsnn: 7.7
        Fermi_Motion: frozen
        Impact:
            Range: [0.0,3.3] # 0-5%

        Initial_Conditions:
            Type: "Dynamic"
            Energy_Density_Threshold: 0.5
            Formation_Time_Fraction: 0.2
            Fluidizable_Processes: ["All"]
            Delay_Initial_Elastic: true

Collision_Term:
    Force_Decays_At_End: false
